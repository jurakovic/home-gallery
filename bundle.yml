targets:
  - platform: all
    arch: generic
    command: false
  - platform: linux
    arch: x64
    command: ['{{caxa}}/home-gallery/node/bin/node', '{{caxa}}/home-gallery/gallery.js']
  #- platform: linux
  #  arch: arm64
  #  command: ['{{caxa}}/home-gallery/node/bin/node', '{{caxa}}/home-gallery/gallery.js']
  - platform: win
    arch: x64
    command: ['{{caxa}}/home-gallery/node/node.exe', '{{caxa}}/home-gallery/gallery.js']
  - platform: darwin
    arch: x64
    command: ['{{caxa}}/home-gallery/node/bin/node', '{{caxa}}/home-gallery/gallery.js']
before:
  - npm run clean
  - npm run build
  # Native modules of all bundle targets: the vendor packages of ffmpeg,
  # ffprobe and exiftool and the prebuilt binaries of sharp. npm installs only
  # the ones of the build host, the bundler picks the matching ones per target
  # by their `os` and `cpu` properties
  - node scripts/install-native-deps.js --platforms=linux-x64,darwin-x64,win-x64 @ffmpeg-installer/linux-x64 @ffmpeg-installer/win32-x64 @ffmpeg-installer/darwin-x64 @ffprobe-installer/linux-x64 @ffprobe-installer/win32-x64 @ffprobe-installer/darwin-x64 exiftool-vendored.exe exiftool-vendored.pl
  - node scripts/download-nodejs.js --version=24.14.0 --platforms=linux-x64,darwin-x64,win-x64 --targetDir=node
packages:
  - './packages/cli'
includes:
  - ./package.json
  - ./CHANGELOG.md
  - ./README.md
  - ./LICENSE
  - ./gallery.js
  - ./gallery.config-example.yml
  - ./.build.json
  - pattern: node/linux-x64
    platformArch: linux-x64
  - pattern: node/linux-arm64
    platformArch: linux-arm64
  - pattern: node/darwin-x64
    platformArch: darwin-x64
  - pattern: node/win-x64
    platformArch: win-x64
excludes:
  - node_modules/.bin/*
  - '*/node_modules/.bin/*'
  - node_modules/.cache/*
  - '*/node_modules/.cache/*'
  - pattern: node_modules/sharp
    arch: generic
map:
  - packages/: node_modules/@home-gallery/
  - from: node/linux-x64/
    to: node/
    platformArch: linux-x64
  - from: node/linux-arm64/
    to: node/
    platformArch: linux-arm64
  - from: node/darwin-x64/
    to: node/
    platformArch: darwin-x64
  - from: node/win-x64/
    to: node/
    platformArch: win-x64
output:
  dir: dist
  name: home-gallery
  prefix: home-gallery/
