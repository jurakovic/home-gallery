---
name: 'build binaries'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      filter:
        description: 'Platform-arch targets, e.g. win-x64 or linux-x64,win-x64. Empty builds all'
        type: string
        required: false
        default: 'win-x64'

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # A step `if` can not read the secrets context, a job env can
      DEPLOY_HOST: ${{ secrets.SSH_HOSTNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Prepare
        id: prepare
        run: |
          SHORTREF=${GITHUB_SHA::8}
          BRANCH=${GITHUB_REF#refs/heads/}
          VERSION=${BRANCH//\//-}
          SNAPSHOT="-$(date +%Y%m%d)-${SHORTREF}"
          BUILD_VERSION=${BRANCH}-${SHORTREF}
          TARGET_DIR=unstable/

          # If this is git tag, use the tag name as a docker tag
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            # If we have a major.minor.patch version install
            # binary below the root
            if [[ $TAG_VERSION =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
              VERSION=$TAG_VERSION
              BUILD_VERSION=$VERSION
              SNAPSHOT=
              TARGET_DIR=/
            fi
          fi

          echo "{\"version\":\"${BUILD_VERSION}\",\"commit\":\"${GITHUB_SHA}\",\"created\":\"$(date -Is)\",\"createdBy\":\"github action #${{ github.run_id }}\"}" | tee .build.json

          # Set output parameters.
          echo VERSION=${VERSION} >> $GITHUB_OUTPUT
          echo SNAPSHOT=${SNAPSHOT} >> $GITHUB_OUTPUT
          echo TARGET_DIR=${TARGET_DIR} >> $GITHUB_OUTPUT

      - name: Install packages
        id: install
        run: |
          rm -rf packages/api-server
          node scripts/disable-dependency.js api-server
          npm install --force

      - name: Build packages
        id: build
        env:
          BUNDLE_FILTER: ${{ inputs.filter }}
        run: |
          npx pnpm --filter '*bundle' build
          args=("--version=${{ steps.prepare.outputs.VERSION }}" "--snapshot=${{ steps.prepare.outputs.SNAPSHOT }}")
          # Empty on a tag push, which builds every target of bundle.yml
          if [ -n "$BUNDLE_FILTER" ]; then
            args+=("--filter=$BUNDLE_FILTER")
          fi
          node scripts/bundle.js "${args[@]}"

      # The caxa binaries stay behind, only the archives are attached
      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: home-gallery-${{ steps.prepare.outputs.VERSION }}${{ steps.prepare.outputs.SNAPSHOT }}
          path: |
            dist/${{ steps.prepare.outputs.VERSION }}/*.tar.gz*
            dist/${{ steps.prepare.outputs.VERSION }}/sha256sums.txt
          if-no-files-found: error
          retention-days: 14

      - name: Deploy via rsync
        id: deploy
        if: env.DEPLOY_HOST != ''
        uses: up9cloud/action-rsync@master
        env:
          HOST: ${{secrets.SSH_HOSTNAME}}
          USER: ${{secrets.SSH_USERNAME}}
          KEY: ${{secrets.SSH_PRIVATE_KEY}}
          SOURCE: ./dist/
          TARGET: ${{ steps.prepare.outputs.TARGET_DIR }}
          ARGS: -avz
          SSH_ARGS: '-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no'
          VERBOSE: true
